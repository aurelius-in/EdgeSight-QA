name: policy
on:
  pull_request:
    branches: [ feat/gitops-safety ]
  workflow_dispatch:
jobs:
  conftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install conftest
        run: |
          curl -L https://github.com/open-policy-agent/conftest/releases/download/v0.53.0/conftest_0.53.0_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin/
      - name: Render manifests (kustomize)
        run: |
          sudo apt-get update && sudo apt-get install -y kustomize
          kustomize build serve > /tmp/rendered.yaml
      - name: Run policy checks
        run: |
          conftest test /tmp/rendered.yaml -p policy/opa