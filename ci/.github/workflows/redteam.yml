name: redteam-nightly
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install conftest
        run: |
          curl -L https://github.com/open-policy-agent/conftest/releases/download/v0.53.0/conftest_0.53.0_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin/
      - name: Run redteam policy checks
        run: |
          bash redteam/run_redteam.sh || true
      - name: Upload redteam report
        uses: actions/upload-artifact@v4
        with:
          name: redteam-report
          path: redteam/reports/**/infra-chaos.md