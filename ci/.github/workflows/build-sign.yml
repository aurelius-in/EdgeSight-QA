name: build-sign
on:
  push:
    branches: [ feat/gitops-safety ]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/edgesight-qa:ci-${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar
      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate SBOM (syft)
        run: syft packages /tmp/image.tar -o spdx-json > security/sbom/syft-${{ github.sha }}.spdx.json
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/edgesight-qa:ci-${{ github.sha }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign ghcr.io/${{ github.repository_owner }}/edgesight-qa:ci-${{ github.sha }}
      - name: Verify signature
        run: |
          cosign verify ghcr.io/${{ github.repository_owner }}/edgesight-qa:ci-${{ github.sha }}
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: security/sbom/*.spdx.json