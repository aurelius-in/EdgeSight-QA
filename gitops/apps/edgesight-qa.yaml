apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edgesight-qa-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aurelius-in/EdgeSight-QA.git
    targetRevision: feat/gitops-safety
    path: gitops/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: vision
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
